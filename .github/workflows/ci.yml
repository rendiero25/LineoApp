name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # 17 is the project's JVM target and the toolchain detekt and the tests run on;
      # 25 runs the Gradle daemon, matching gradle/gradle-daemon-jvm.properties.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Static analysis
        run: ./gradlew detekt lint --stacktrace

      - name: Dependency licences
        run: ./gradlew checkDependencyLicenses --stacktrace

      # The measured build, and the module that measures it. Compiling both on every PR is
      # what stops a benchmark from rotting while nobody runs it — the numbers themselves
      # need a device and are taken on one (P1-10).
      - name: Release build and benchmarks compile
        run: ./gradlew :app:assembleRelease :benchmark:assembleBenchmark --stacktrace

      - name: APK size
        # The 12 MB ceiling of docs/ANDROID_STANDARDS.md §3, enforced rather than remembered.
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          bytes=$(stat -c%s "$apk")
          echo "$apk is $((bytes / 1024)) KiB"
          test "$bytes" -lt 12582912

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
